<div class="list-header">
  <div>
    <h1>Clientes</h1>
    <p>Gerenciamento de clientes cadastrados no portal.</p>
  </div>
  <button mat-raised-button color="primary" (click)="openClientForm()">
    <mat-icon>add</mat-icon> Novo Cliente
  </button>
</div>

<mat-card class="table-card mat-elevation-z4">
  <mat-card-content>
    <div class="filter-header">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Buscar Cliente</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex: Nome, CPF..." #input>
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <div *ngIf="loading()" class="spinner-container">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div *ngIf="!loading()" class="table-container">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z0">
        <!-- Nome Column -->
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef> Nome / Razão Social </th>
          <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
        </ng-container>

        <!-- CPF/CNPJ Column -->
        <ng-container matColumnDef="cpf_cnpj">
          <th mat-header-cell *matHeaderCellDef> CPF / CNPJ </th>
          <td mat-cell *matCellDef="let element"> {{element.cpf_cnpj}} </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef> E-mail </th>
          <td mat-cell *matCellDef="let element"> {{element.email}} </td>
        </ng-container>

        <!-- Telefone Column -->
        <ng-container matColumnDef="telefone">
          <th mat-header-cell *matHeaderCellDef> Telefone </th>
          <td mat-cell *matCellDef="let element"> {{element.telefone || '-'}} </td>
        </ng-container>

        <!-- Ações Column -->
        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef class="actions-header"> Ações </th>
          <td mat-cell *matCellDef="let element" class="actions-cell">
            <!-- Desktop Actions -->
            <div class="actions-wrapper desktop-actions">
              <button mat-icon-button color="primary" (click)="openProposalFormForClient(element)" title="Nova Proposta">
                <mat-icon>add_circle_outline</mat-icon>
              </button>
              <button mat-icon-button color="accent" (click)="viewClientProposals(element)" title="Ver Propostas">
                <mat-icon>folder_open</mat-icon>
              </button>
              <button mat-icon-button (click)="openClientForm(element)" title="Editar Cliente">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteClient(element)" title="Deletar Cliente">
                <mat-icon>delete</mat-icon>
              </button>
            </div>

            <!-- Mobile Actions Menu -->
            <div class="actions-wrapper mobile-actions">
              <button mat-icon-button [matMenuTriggerFor]="clientMenu" aria-label="Ações do cliente">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #clientMenu="matMenu" xPosition="before">
                <button mat-menu-item (click)="openProposalFormForClient(element)">
                  <mat-icon color="primary">add_circle_outline</mat-icon>
                  <span>Nova Proposta</span>
                </button>
                <button mat-menu-item (click)="viewClientProposals(element)">
                  <mat-icon color="accent">folder_open</mat-icon>
                  <span>Ver Propostas</span>
                </button>
                <button mat-menu-item (click)="openClientForm(element)">
                  <mat-icon>edit</mat-icon>
                  <span>Editar Cliente</span>
                </button>
                <button mat-menu-item (click)="deleteClient(element)">
                  <mat-icon color="warn">delete</mat-icon>
                  <span>Deletar Cliente</span>
                </button>
              </mat-menu>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="5" style="text-align: center; padding: 24px;">
            Nenhum cliente encontrado para a busca "{{input.value}}"
          </td>
        </tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
